# generated by ops/scripts/goatlite-render.py from goatlite.yaml — edit goatlite.yaml, or remove this line to own the file
---
# SPIRE on zagros (phase 9, spire-deploy.yml): the founder is the goatnet's SPIRE
# server. Trust domain is LOCKED once minted (rename is the expensive retrofit).
spire_trust_domain: "zagros.zagros.lan"

# The router trusts its own offline CA (its server cert + portal per-uuid certs)
# AND the SPIRE CA (the fabric-health SVID).
goat_zenoh_extra_ca_paths:
  - "/opt/spire/data/server/spire-ca.pem"

fabric_health_identity_source: "spire"

# spire-trust-sync: the merged trust bundle the router loads, and
# the container to bounce when a rotated SPIRE CA lands in it.
spire_trust_sync_router_trust_file: "/etc/zagros-zenoh/tls/ca-root-cert.pem"
spire_trust_sync_restart_containers:
  - "zagros-zenoh-router"

# Not federated: recognition is not authorization (federated-trust-model.md).
spire_federation_enabled: false

# The SPIRE datastore password, bound HERE and not left to the role default.
# `secrets init` reads group_vars only (ops/scripts/deploy-secrets-needed.py
# env_bindings), so a binding that lives in roles/spire/defaults/main.yml is
# invisible to it: the variable is never generated, renders empty, and phase 9
# fails in docker compose with "required variable SPIRE_DB_PASSWORD is missing
# a value" about 5 minutes after the real cause. The name must be a literal
# here: that scanner's regex captures a quoted constant, not an expression.
spire_db_password: "{{ lookup('env', 'ZAGROS_SPIRE_DB_PASS') }}"
