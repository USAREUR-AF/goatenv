# generated by ops/scripts/goatlite-render.py from goatlite.yaml — edit goatlite.yaml, or remove this line to own the file
---
# audit-subscriber on zagros (essential tier — the ADR 0811 tier-2 write path into MinIO).
audit_subscriber_id: "zagros-A"
# mesh_ip_a is the LAN address on a goatlite (services LAN-bound).
audit_subscriber_s3_endpoint: "http://{{ mesh_ip_a }}:9000"
audit_subscriber_s3_bucket: "audit-integrity"
audit_subscriber_s3_region: "us-east-1"
audit_subscriber_s3_access_key_envvar: "ZAGROS_AUDIT_SUBSCRIBER_S3_ACCESS_KEY"
audit_subscriber_s3_secret_key_envvar: "ZAGROS_AUDIT_SUBSCRIBER_S3_SECRET_KEY"
audit_subscriber_identity_model: per-uuid-slot-pool
