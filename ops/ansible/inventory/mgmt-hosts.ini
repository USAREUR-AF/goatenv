# Hosts by goatnet. goatlite adds its block here.
[mgmt_hosts:children]
# BEGIN goatlite zagros (mgmt_hosts child)
zagros_hosts
# END goatlite zagros (mgmt_hosts child)

# BEGIN goatlite zagros
# zagros — a goatlite goatnet (ADR 1213): ONE LAN box, rendered from goatlite.yaml by
# ops/scripts/goatlite-render.py. site_name/router_role feed the LUKS passphrase
# var name (ZAGROS_A_LUKS_PASS) and the node identity; signal_uri is the LAN
# enrolment apex served by the host's own Traefik + LAN CoreDNS.
[zagros_hosts]
mgmt-zagros-01 ansible_host=192.0.2.10 ansible_user=ubuntu site_name=zagros-a router_role=A signal_uri=netbird.zagros.lan:443

[zagros_hosts:vars]
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3
# No ansible_aws_ssm_* — no cloud footprint at all for a goatlite.
# END goatlite zagros
