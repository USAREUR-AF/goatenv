# generated by ops/scripts/goatlite-render.py from goatlite.yaml — edit goatlite.yaml, or remove this line to own the file
# Leaf-cert manifest for example-internet, a goatlite goatnet grown to the internet (ADR 1213,
# goatlite.md §6), rendered from ops/enrollment/manifests/TEMPLATE-certs.yaml with
# every site value threaded. Phase 4 (`mint-site-certs.sh example-internet --mint-ca-if-missing`)
# mints the CA named below if it does not exist, then every leaf. NO SECRETS HERE —
# subjects, SANs, EKUs and paths only. The dashboard and the mgmt names carry ACME
# certificates (phase 7), so there are no LAN leaves. The router row's TBD_EXAMPLE_INTERNET_MESH_IP_A
# resolves from mesh_ip_a; phase 8 re-mints the router once lite.internet.mesh_ip is set.

site_id: example-internet          # lowercase instance id, e.g. hobby — must match
                              # the argument to mint-site-certs.sh

ca:
  root_cert: ops/enrollment/ca/example-internet/root-cert.pem
  root_key: ~/.goat/state/example-internet-ca/ca.key.age
  age_identity: ~/.config/age/keys.txt
  ca_id: dev-example-internet-ca-ecdsa-2026-11-05            # e.g. dev-<site>-ca-ecdsa-<YYYY-MM-DD>; read it
                              # back from the root cert, do not invent one

out_dir: ~/.goat/state/example-internet-leaves

# CN convention: <service>-trial-peer, matching the other tiers. A dev tier
# exists to be the same shape as the tiers above it, and the zenoh ACL matches
# readers BY CN — so a goatnet minting `panoscope` while its siblings enumerate
# `panoscope-trial-peer` has every reader named-but-absent and every present
# reader unnamed. The template was internally inconsistent about this: `operator`
# already carried the suffix, these three did not.
leaves:
  # --- router server cert — POST-ENROLL ---------------------------------
  # This row cannot be completed before phase 10. The mesh IP does not exist
  # until the host enrolls onto its own goatnet, and a RE-enrollment reassigns
# it. So: run the loop
  # pre-enroll to mint everything else, then fill the IP and
  # `mint-site-certs.sh <site> --only router`.
  - name: router
    cn: goat-zenoh-router
    eku: serverAuth,clientAuth
    sans:
      - goat-zenoh-router
      - zenoh.example-internet.netbird.goatnet.example
      - TBD_EXAMPLE_INTERNET_MESH_IP_A   # resolves to mesh_ip_a = lite.internet.mesh_ip, set after phase 8
      - 127.0.0.1

  # --- infra peers ------------------------------------------------------
  # CN matches the router ACL subject; URI is urn:goat:<site>:infra:<svc>.
  # Delete any row whose service this goatnet does not deploy — a minted-and-
  # unused leaf is key material with no owner. Check against this goatnet's
  # group_vars file inventory (standup-config-preflight.py <group> --scaffold-plan).
  - name: audit-subscriber
    cn: audit-subscriber
    sans: [audit-subscriber]
    uri_sans: ["urn:goat:example-internet:infra:audit-subscriber"]
  - name: fabric-crawler
    cn: goat-fabric-crawler-trial-peer
    sans: [goat-fabric-crawler-trial-peer]
    uri_sans: ["urn:goat:example-internet:infra:fabric-crawler"]
  - name: goat-topology
    cn: goat-topology-trial-peer
    sans: [goat-topology-trial-peer]
    uri_sans: ["urn:goat:example-internet:infra:topology"]
  - name: fabric-health
    cn: fabric-health-trial-peer
    sans: [fabric-health-trial-peer]
    uri_sans: ["urn:goat:example-internet:infra:fabric-health"]
  - name: grant-keyd
    cn: grant-keyd-trial-peer
    sans: [grant-keyd-trial-peer]
    uri_sans: ["urn:goat:example-internet:infra:grant-keyd"]
  - name: mesh-health
    cn: goat-mesh-health-trial-peer
    sans: [goat-mesh-health-trial-peer]
    uri_sans: ["urn:goat:example-internet:infra:mesh-health"]
  - name: node-net-health
    cn: goat-node-net-health-trial-peer
    sans: [goat-node-net-health-trial-peer]
    uri_sans: ["urn:goat:example-internet:infra:node-net-health"]
  - name: ntp-health-pub
    cn: ntp-health-pub-trial-peer
    sans: [ntp-health-pub-trial-peer]
    uri_sans: ["urn:goat:example-internet:infra:ntp-health-pub"]
  - name: presence-health
    cn: goat-presence-health-trial-peer
    sans: [goat-presence-health-trial-peer]
    uri_sans: ["urn:goat:example-internet:infra:presence-health"]
  - name: time-health
    cn: goat-time-health-trial-peer
    sans: [goat-time-health-trial-peer]
    uri_sans: ["urn:goat:example-internet:infra:time-health"]
  - name: consistency-health
    cn: goat-consistency-health-trial-peer
    sans: [goat-consistency-health-trial-peer]
    uri_sans: ["urn:goat:example-internet:infra:consistency-health"]
  - name: consistency-console
    cn: goat-consistency-console-trial-peer
    sans: [goat-consistency-console-trial-peer]
    uri_sans: ["urn:goat:example-internet:infra:consistency-console"]
  # The acceptance assay's probe identity (goatnet-acceptance-suite.md
  # §"The probe identity"); keep it when the goatnet sets assay_probe_enabled.
  - name: assay-probe
    cn: goat-assay-probe-trial-peer
    sans: [goat-assay-probe-trial-peer]
    uri_sans: ["urn:goat:example-internet:infra:assay-probe"]

  # --- operator surfaces ------------------------------------------------
  # All four share one URI (urn:goat:<site>:operator) — that is the operator
  # class, not a per-surface identity. Keep it that way; the router ACL grants
  # on the class.
  - name: flashlight
    cn: flashlight-trial-peer
    sans: [flashlight]
    uri_sans: ["urn:goat:example-internet:operator"]
  - name: operator
    cn: operator-trial-peer
    sans: [operator-trial-peer]
    uri_sans: ["urn:goat:example-internet:operator"]
  - name: panoscope
    cn: panoscope-trial-peer
    sans: [panoscope]
    uri_sans: ["urn:goat:example-internet:operator"]
  - name: stethoscope
    cn: stethoscope-trial-peer
    sans: [stethoscope]
    uri_sans: ["urn:goat:example-internet:operator"]

  # --- the founder: the one person on a goatlite
  - name: founder
    cn: goat-founder-trial-peer
    sans: [goat-founder-trial-peer]
    uri_sans: ["urn:goat:example-internet:operator:founder"]
