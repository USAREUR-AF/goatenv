# generated by ops/scripts/goatlite-render.py from goatlite.yaml — edit goatlite.yaml, or remove this line to own the file
---
# MinIO on example-internet (essential tier — the audit tier-2 store, ADR 0811), scaled to one
# box (service-criticality-tiers.md §3: 1 GiB mem cap; small quotas).
minio_root_user_envvar: "EXAMPLE_INTERNET_MINIO_ROOT_USER"
minio_root_password_envvar: "EXAMPLE_INTERNET_MINIO_ROOT_PASSWORD"
minio_audit_retention_days: 30
minio_audit_object_lock_mode: "GOVERNANCE"
minio_audit_bucket_quota_gib: 20
minio_telemetry_bucket_quota_gib: 2
minio_runtime_detection_bucket_quota_gib: 2
minio_mem_limit: "1g"
minio_extra_users:
  - name: goat-portal-audit-read
    policy_name: goat-portal-audit-read
    policy_src: "{{ playbook_dir }}/../minio/policies/audit-read.json"
    secret_envvar: EXAMPLE_INTERNET_PORTAL_AUDIT_S3_SECRET_KEY
  - name: audit-subscriber
    policy_name: audit-write
    policy_src: "{{ playbook_dir }}/../minio/policies/audit-write.json"
    secret_envvar: EXAMPLE_INTERNET_AUDIT_SUBSCRIBER_S3_SECRET_KEY
# Console OIDC off: fewest moving parts on one box.
minio_operator_idp_enabled: false
minio_console_traefik_enabled: false
