# generated by ops/scripts/goatlite-render.py from goatlite.yaml — edit goatlite.yaml, or remove this line to own the file
---
# example-internet — a goatlite goatnet grown to the internet (ADR 1213, docs/design/goatlite.md §6):
# ONE box, enrollable from anywhere through its own relays, stood up by
# docs/operations/goatnet-standup.md in its internet profile, tier ceiling 1.
# Status: WIP, not for production use — gate: one internet standup from the rendered example on real relays.
# The values below are the preset's decisions (goatlite.md §3, §6); the facts come
# from goatlite.yaml (name, host, ssh_user, admin and the lite.internet block). Edit
# goatlite.yaml and re-run `goatlite-render.py --site example-internet`, or delete the first line
# and own this file.

# -- Site identity -----------------------------------------------------------
environment: example-internet
site_id: example-internet
site_id_upper: EXAMPLE_INTERNET
site_description: >-
  example-internet — goatlite goatnet grown to the internet (ADR 1213): one host, own
  NetBird mesh (P2P, relay fallback through 2 relay(s)), public zone
  goatnet.example with ACME certificates, own internal CA, own Ory + Postgres (no
  Spock), own Zenoh router; core + essential tiers only
goatnet_founder: true
goatlite_host: "192.0.2.20"

# -- Criticality tier ceiling (service-criticality-tiers.md §4) --------------
site_deploy_tier_max: 1

# -- Mgmt-stack profile + axis vars ------------------------------------------
mgmt_stack_profile: full
has_mgmt_api: true
intra_site_pair: false
has_durable_independent_state: true
participates_in_spock: false
spock_peered: false
inter_site_spock_topology: none
inter_site_spock_peers: []
has_obs_host: false
# -- What this one box runs and does not, named for the end state (ADR 1206) --
# No observability stack on a goatlite (goatlite.md §7); the obs rows read N/A.
prometheus_enabled: false
alertmanager_enabled: false
grafana_enabled: false
# Off on a goatlite today (see LITE_ABSENT): MinIO and the audit subscriber (the
# pinned MinIO image no longer exists upstream), the identity console (mail and
# external identity doors). The served goat and goatbuilder fetch release
# assets with a GitHub token, an account a goatlite does not need; a learner
# downloads both binaries from the release page.
minio_enabled: false
id_admin_console_enabled: false
goat_get_enabled: false
goat_docs_enabled: false
# No LAN name server: off-LAN peers resolve the service names through mesh
# CoreDNS (phase 12), from ops/dns/<name>/mesh-hosts once lite.internet.mesh_ip
# is set. No relay-health box on a goatlite.
lan_coredns_enabled: false
relay_health_enabled: false
# Phase 12 deploys grant-keyd and the mgmt stack runs admit-audit; the
# peripheral surfaces are not part of a goatlite.
grant_keyd_enabled: true
admit_audit_enabled: true
isitup_enabled: false
demogame_enabled: false
brief_enabled: false
compliance_proxy_enabled: false
dataflows_enabled: false
goat_logship_enabled: false
goat_trashgoat_enabled: false
has_acme: true
has_internal_ca: true

# -- rescue nodes (ADR 1183) --------------------------------------------------
has_breakglass_node: false
breakglass_absent_reason: >-
  goatlite is one box on a LAN its operator can walk to (ADR 1213); there is no
  remote reach to lose and no second machine. Recovery is the console.
has_network_jump_node: false
network_jump_absent_reason: >-
  No NETWORK-class gear is enrolled on a goatlite goatnet.
snitch_enabled: false
name_snapshot_enabled: false

# -- Host LAN identity --------------------------------------------------------
# Every service bind, cert SAN and example-internet.lan record derives from the one host.
lan_allowlist_cidr: "192.0.2.0/24"

# -- Disk encryption: ON (goatnet-standup.md decision 1; os-baseline-and-luks.md R4) --
# One data disk (goatlite.yaml data_disk, default /dev/nvme0n1 — CHECK IT: phase 2
# formats an unformatted device), passphrase slot 0 as break-glass, no Tang (a
# single host has no sibling to bind to). EXAMPLE_INTERNET_A_LUKS_PASS is the passphrase.
docker_engine_data_root: "/opt/docker-data/docker"
docker_engine_containerd_root: "/opt/docker-data/containerd"
require_docker_data_separate_mount: true
luks_passphrase_envvar: "{{ site_id_upper }}_{{ router_role | upper }}_LUKS_PASS"
luks_volumes_mgmt_host:
  - name: docker-data
    device: /dev/nvme0n1
    mount_point: /opt/docker-data
    filesystem: ext4
    unlock_modes: [passphrase]
    format_if_unformatted: true
    passphrase: "{{ lookup('env', luks_passphrase_envvar) | default('', true) }}"
    systemd_requires: [docker.service, containerd.service]
luks_fido2_user_presence: false
luks_fido2_with_pin: false

# -- Timing -------------------------------------------------------------------
chrony_nts_sources:
  - time.cloudflare.com
  - virginia.time.system76.com
  - oregon.time.system76.com
chrony_max_offset_ms: 500
chrony_max_drift_ppm: 50

# -- Internal CA (minted by phase 4, mint-site-certs.sh --mint-ca-if-missing) --
# The var name is the one the goat-zenoh role reads; the VALUE is this goatnet's own CA.
goat_ca_id: "dev-example-internet-ca-ecdsa-2026-11-05"
goat_ca_root_cert: "ops/enrollment/ca/example-internet/root-cert.pem"
goat_ca_root_cert_path: "{{ playbook_dir }}/../enrollment/ca/example-internet/root-cert.pem"
internal_ca_root_path: "{{ playbook_dir }}/../enrollment/ca/example-internet/root-cert.pem"
trust_domain: example-internet-goatnet

# -- DNS zone (public apex, mesh CoreDNS for the service names) ---------------
# The enrolment apex netbird.goatnet.example is public: Cloudflare round-robins it across the
# relays (terraform-example-internet/), and each relay tunnels :443 back to this box (rathole,
# phase 5). site_dns_zone equals the apex, which traefik-acme.yml requires of a
# site carrying Ory. Service names render <svc>.example-internet.netbird.goatnet.example and live only in
# mesh CoreDNS, so only enrolled peers resolve them.
site_dns_zone: netbird.goatnet.example
public_mgmt_fqdn: netbird.goatnet.example
site_enrollment_dns: "netbird.goatnet.example"
# Phase 8 enrols the box with a single-use key against this URL; the relays
# answer :443 for the apex (mesh-enroll-host.yml checks the port).
mesh_enrollment_url: "https://{{ site_enrollment_dns }}:443"
site_vip_dns: "mgmt.{{ site_id }}.{{ site_dns_zone }}"
# goat-coredns.yml serves the mesh zone on mesh_ip_a:5353; the account-init
# nameserver seed points every peer there for *.netbird.goatnet.example.
mesh_coredns_port: 5353

# -- Traefik TLS (Let's Encrypt through Cloudflare DNS-01, phase 7) ------------
# Two ACME certificates (traefik-acme.yml): netbird.goatnet.example for the public :443
# path, and *.example-internet.netbird.goatnet.example for the mesh-only names. The internal CA still
# issues the router, SPIRE and every fabric identity.
traefik_services: []
mgmt_dynamic_cert_mode: acme
mgmt_dynamic_include_grafana: false
dashboard_cert_delivery_mode: acme
acme_email: "admin@example.org"
# A reference, never a value: CLOUDFLARE_API_TOKEN_EXAMPLE_INTERNET is resolved by the declared
# secrets posture for each run (ADR 1204). Phase 7 reads the same name.
cloudflare_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN_EXAMPLE_INTERNET') }}"

# -- mgmt-host-compose-watch allowlist ---------------------------------------
mgmt_host_compose_watch_services: "postgres-a signal-a management-a admit-audit traefik kratos hydra selfservice-ui dashboard oauth2-proxy-dashboard"

# -- Required at deploy time (generated by newsite-secrets.sh, phase 3) -------
required_env_vars:
  - EXAMPLE_INTERNET_PG_PASS
  - EXAMPLE_INTERNET_NB_ENCKEY
  - EXAMPLE_INTERNET_BKP_KEY
  - EXAMPLE_INTERNET_REPLICATOR_PASS
  - EXAMPLE_INTERNET_RELAY_SECRET

# -- Ory + netbird-dashboard ---------------------------------------------------
kratos_cookie_secret: "{{ lookup('env', 'EXAMPLE_INTERNET_KRATOS_COOKIE') }}"
kratos_cipher_secret: "{{ lookup('env', 'EXAMPLE_INTERNET_KRATOS_CIPHER') }}"
hydra_secrets_system: "{{ lookup('env', 'EXAMPLE_INTERNET_HYDRA_SYSTEM') }}"
hydra_secrets_cookie: "{{ lookup('env', 'EXAMPLE_INTERNET_HYDRA_COOKIE') }}"
netbird_dashboard_oidc_client_secret: "{{ lookup('env', 'EXAMPLE_INTERNET_DASHBOARD_OIDC_CLIENT_SECRET') | default('', true) }}"
ory_recovery_enabled: true
# Courier OFF: no mail sender exists on a goatlite; password reset is an
# operator-minted link from the console.
ory_courier_smtp_enabled: false
ui_cookie_secret: "{{ lookup('env', 'EXAMPLE_INTERNET_UI_COOKIE_SECRET') }}"
ui_csrf_secret: "{{ lookup('env', 'EXAMPLE_INTERNET_UI_CSRF_SECRET') }}"
ory_shared_nid: "{{ lookup('env', 'EXAMPLE_INTERNET_ORY_SHARED_NID') }}"

# -- OIDC clients phase 10 registers (site-oidc-clients.yml) -------------------
# Bound here so `goatbuilder secrets init` generates each one (32+ characters).
# The dashboard fence (dashboard-fence-deploy.yml) is not part of the standup,
# so the dashboard is served directly, behind its own OIDC login.
dashboard_oauth2_proxy_enabled: false
dashboard_oauth2_proxy_client_secret: "{{ lookup('env', 'EXAMPLE_INTERNET_DASHBOARD_OAUTH2_PROXY_CLIENT_SECRET') }}"
dashboard_oauth2_proxy_cookie_secret: "{{ lookup('env', 'EXAMPLE_INTERNET_DASHBOARD_OAUTH2_PROXY_COOKIE_SECRET') }}"
isitup_oidc_client_secret: "{{ lookup('env', 'EXAMPLE_INTERNET_ISITUP_OIDC_CLIENT_SECRET') }}"
id_admin_console_oauth2_proxy_client_secret: "{{ lookup('env', 'EXAMPLE_INTERNET_ID_ADMIN_CONSOLE_OAUTH2_PROXY_CLIENT_SECRET') }}"

auth_audience: "{{ netbird_dashboard_oidc_client_id | default('netbird-dashboard') }}"
auth_issuer: "https://oauth2.{{ site_id }}.{{ site_dns_zone }}/"
auth_oidc_config_endpoint: "http://hydra:4444/.well-known/openid-configuration"
auth_idp_sign_key_refresh: true

# First administrator (goatnet-standup.md decision 2): the one person named in
# goatlite.yaml. Widen the roster via goat-user, never by hand-editing Kratos.
site_admins:
  - email: admin@example.org
    name: "admin@example.org"
    groups: ["PLATFORM-ADMIN"]

# Setup-key enrolment only, on purpose (check-identity-plane-completeness.sh).
netbird_pkce_client_id: ""

# -- Signal / STUN / relay posture (internet: relays from terraform-example-internet/) -------
# One relay per lite.internet.relays entry, named as terraform/modules/goat-relay
# names it. Each runs coturn (STUN :3478) and the NetBird relay (:33073), and
# tunnels the public :443 back to this box over rathole (phase 5; the tunnel
# settings are group_vars/all.yml's rathole_* defaults).
signal_proto: https
stun_hosts:
  - goat-relay-a.goatnet.example
  - goat-relay-b.goatnet.example
relay_addresses:
  - "rels://goat-relay-a.goatnet.example:33073"
  - "rels://goat-relay-b.goatnet.example:33073"
relay_secret: "{{ lookup('env', 'EXAMPLE_INTERNET_RELAY_SECRET') }}"
relay_credentials_ttl: "24h"
# The AWS profile the relay steps reach their Secrets Manager entries with (aws_cmd
# in group_vars/all.yml, when the run is not already inside aws-vault).
aws_profile: "example-internet"

# -- Mesh --------------------------------------------------------------------
# The host enrols on its own mesh in phase 8; the router and mesh CoreDNS bind
# the mesh address.
install_netbird_daemon: true
# Until phase 8 enrols the box, services bind its address; after it, set
# lite.internet.mesh_ip in goatlite.yaml to the address `netbird status` shows
# and re-render: the router cert (phase 8 re-mint) and mesh CoreDNS follow it.
mesh_ip_a: "192.0.2.20"
federation_peers_for_a: ""

# -- Management container port (loopback) -------------------------------------
mgmt_container_host_port: "8081"

# -- Acceptance assay probe ----------------------------------------------------
# The assay's goat rows need a fabric identity to probe from, and a goatlite
# has no enrolled person to borrow one from. The probe identity is the
# designed answer: its manifest row is rendered above, and this flag lets
# ops/scripts/create-assay-probe-identity.sh mint and install it. The mint
# itself stays an operator command, never a playbook side effect.
assay_probe_enabled: true
# The founder's own fabric identity: a goatlite runs no identity console,
# so ops/scripts/create-founder-identity.sh mints a person leaf with this CN from
# the goatnet's CA and installs it as a goat context on the laptop. The router
# admits it (founder-w in roles/goat-zenoh) only where this is set.
zenoh_founder_cn: goat-founder-trial-peer

# -- Portal registry store -----------------------------------------------------
# The box runs its own Postgres, and every portal image pinned today stores
# the registry in Postgres. A new goatnet starts there directly: there is no
# SQLite data to move, so the cutover playbook does not apply. The password is
# bound here with a literal name so `secrets init` and the phase 1 scan see it
# (a role default computes the name, which the scanners cannot read).
portal_store: postgres
portal_db_password: "{{ lookup('env', 'EXAMPLE_INTERNET_PORTAL_DB_PASS') }}"
# No one has been admitted to a new goatnet yet, so there is no roster to
# serve. An empty path is the role's documented way to say that; the
# data-access panel reports the gap instead of failing. When this goatnet
# admits people, generate its roster (ops/operators/gen-roster.py --env example-internet)
# and set this to the role's default again.
portal_roster_path: ""

# SPIRE server host port. Its role default is also 8081, which management-a
# holds (just above), and traefik holds 8082. The container still listens on
# 8081 internally.
spire_server_host_port: "8083"

# -- Setup-key TTLs ------------------------------------------------------------
setup_key_ttl_days_bootstrap: 1
setup_key_ttl_days_admin: 7
setup_key_ttl_days_operator: 30
setup_key_ttl_days_peer: 7

# -- Backup --------------------------------------------------------------------
pgbackrest_stanza: "{{ site_id }}-netbird"

# -- Zenoh fabric (per-uuid slot pool, LAN-address bind) -----------------------
zenoh_stack: "example-internet-zenoh"
zenoh_identity_model: per-uuid-slot-pool
zenoh_slot_pool_salt: "{{ lookup('env', 'EXAMPLE_INTERNET_SLOT_POOL_SALT') }}"
zenoh_slot_pool_size: 1000
zenoh_listen_host_override: "{{ mesh_ip_a }}"
goat_zenoh_rest_host: "127.0.0.1"
# The fleet zenoh pin is the pqc-fips variant; the flag must move with it (row 25, F-260).
goat_zenoh_fips_variant: true

# -- goat-zenoh-portal (essential tier) ----------------------------------------
portal_traefik_host: "portal.{{ site_id }}.{{ site_dns_zone }}"
portal_traefik_network: "mgmt"
portal_traefik_cert_resolver: "le"
portal_zenoh_network: "{{ zenoh_stack }}_default"
portal_zenoh_rest_url: "http://{{ zenoh_stack }}-router:8000"
portal_identity_model: per-uuid-slot-pool
portal_slot_pool_salt: "{{ lookup('env', 'EXAMPLE_INTERNET_SLOT_POOL_SALT') }}"
portal_slot_pool_size: 1000
# Cert identity — Class A, freeze-critical (CI: check-portal-cert-identity-override.sh)
portal_cert_sign_site_id: "example-internet"
portal_cert_sign_uri_prefix: "urn:goat:example-internet:org="
portal_cert_sign_cn_suffix: "-peer"
portal_cert_sign_dns_suffix: "example-internet.peer"
portal_onboarding_packet_name: "example-internet-fabric-onboarding.md"
portal_onboarding_tarball_stem: "example-internet-onboarding"
portal_onboarding_root_cert_name: "example-internet-ca-root.pem"
portal_router_endpoint: "tls/zenoh.{{ site_id }}.{{ site_dns_zone }}:7447"
portal_public_url: "https://portal.{{ site_id }}.{{ site_dns_zone }}"
portal_publish_cloudflare_dns: false
# Display lexicon (display-only — portal-lexicon.md)
portal_lex_product_name: "example-internet"
portal_lex_product_title: "example-internet Portal"
portal_lex_org: "slot"
portal_kratos_admin_url: "http://kratos:4434"
portal_ca_bundle_dir: "/etc/example-internet-ca"
portal_age_identity_path: "/etc/example-internet-age/keys.txt"
portal_ca_root_cert: "/etc/example-internet-ca/root-cert.pem"
portal_cert_sign_ca_id: "{{ goat_ca_id }}"
portal_bundle_create_bin: "/usr/local/bin/bundle-create"
portal_operator_api_key: "{{ lookup('env', 'EXAMPLE_INTERNET_PORTAL_OPERATOR_API_KEY') }}"
portal_traefik_mesh_only_middleware: "mesh-only-allowlist@file"

# -- Onboarding-email environment identity (goatnet-turnkey-standup.md) -------
id_admin_console_notify_goatnet_tagline: "example-internet goatlite"
id_admin_console_notify_goatnet_purpose: >-
  example-internet is a goatlite goatnet: one host on a LAN, stood up from one file so its
  operator can learn goat by using it. Nothing on it is production data.

# -- Fail-loud placeholders for role defaults above the tier ceiling -----------
smtp_from: "FAIL-LOUD-example-internet-has-no-smtp"
snitch_collector_url: "FAIL-LOUD-example-internet-has-no-snitch-collector"
demogame_url_host: "FAIL-LOUD-demogame-is-nicety-tier"

# ACME TLS for the per-service dynamic routers, mesh-only (traefik-acme.yml).
goat_get_traefik_cert_resolver: "le"
goat_docs_traefik_cert_resolver: "le"
goat_get_traefik_mesh_only_middleware: "mesh-only-allowlist@file"
goat_docs_traefik_mesh_only_middleware: "mesh-only-allowlist@file"

# -- netbird boot/wedge self-heal: off; one box, nothing to probe ------
netbird_selfheal_enabled: false
