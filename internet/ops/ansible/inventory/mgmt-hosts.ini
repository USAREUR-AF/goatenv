# Hosts by goatnet. goatlite adds its block here.
[mgmt_hosts:children]
# BEGIN goatlite example-internet (mgmt_hosts child)
example_internet_hosts
# END goatlite example-internet (mgmt_hosts child)

# BEGIN goatlite example-internet
# example-internet — a goatlite goatnet grown to the internet (ADR 1213): ONE box, rendered from
# goatlite.yaml by ops/scripts/goatlite-render.py. site_name/router_role feed the LUKS
# passphrase var name (EXAMPLE_INTERNET_A_LUKS_PASS) and the node identity; signal_uri is the public
# enrolment apex the relays answer and tunnel back to this box. The relays have their
# own inventory, inventory/hosts-example-internet.ini, generated in phase 7 from terraform-example-internet/.
[example_internet_hosts]
mgmt-example-internet-01 ansible_host=192.0.2.20 ansible_user=ubuntu site_name=example-internet-a router_role=A signal_uri=netbird.goatnet.example:443

[example_internet_hosts:vars]
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3
# END goatlite example-internet
