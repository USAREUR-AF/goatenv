# Per-goatnet settings for running the live acceptance rows from the operator
# controller (ADR 1115 decision 4; ADR 1173). One entry per fleet-pins goatnet
# key. These are the facts the release candidate was walked with by
# hand; the release-candidate driver (ops/scripts/rc.sh) reads them.
#
#   name             the goatnet's display/profile name (netbird profile, --env)
#   goat_via         "" = goat runs locally; user@host = goat runs there over
#                    ssh (the goatnet's management host, for a goatnet this
#                    laptop is not meshed to; docs/design/env-doors.md)
#   intake_resolve   "" or host=ip: pin the public intake name inside the
#                    browser leg. Needed on a laptop that is ON this goatnet's
#                    mesh, where mesh DNS answers the public name with the
#                    management host's mesh address (F-506). The ip is one of
#                    the goatnet's relay EIPs (terraform-<env>/main.tf).
#   values           the runner's per-env value set; it names the contexts the
#                    rows run as: `goat_sponsor_context` (`acceptance`, the
#                    non-person sponsor identity, ADR 1207) for the intake rows,
#                    `probe_context` (`assay-probe`, the non-person fabric
#                    identity, where the goatnet declares one) for the rows
#                    that read the fabric. No row needs an operator context on a
#                    host: operator keys never go on a host.
schema: goatnet-runners/v0
goatnets:

  # BEGIN goatlite example-internet
  example_internet:
    name: example-internet
    goat_via: ""
    intake_resolve: ""
    values: ops/validation/values-example-internet.yaml
    # END goatlite example-internet
